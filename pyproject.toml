[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[project]
name = "nonlife-pureprem"
version = "0.1.0"
description = "Non-life pure-premium pricing tutorial using French MTPL data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "glum>=3.4.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "rich>=13.9.4",
    "scikit-learn>=1.7.2",
    "scipy>=1.11",
]

[project.scripts]
pure-premium = "nonlife_pureprem.pure_premium:cli"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
target-version = "py314"
