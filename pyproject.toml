[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweedie-regr"
version = "0.1.0"
description = "French MTPL frequency, severity, and pure-premium tutorial"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "glum>=3.4.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.2.0",
    "pyarrow>=22.0.0",
    "rich>=13.9.4",
    "scikit-learn>=1.7.2",
]

[project.scripts]
pure-premium = "tweedie_regr.pure_premium:cli"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
target-version = "py314"
